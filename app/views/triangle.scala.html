      function renderTriangle(cell, rowIndex, colIndex) {
        const { orientation, linked } = cell;
        const size = 50; // Side length of the triangle
        const h = Math.sqrt(3) / 2 * size; // Height of the triangle
    
        // Offsets to ensure the grid starts within the canvas boundaries
        const xOffset = 100; // Adjust based on the canvas width
        const yOffset = 100 + rowIndex * h; // staggered rows
    
        // Convert grid coordinates to SVG pixel coordinates
        const x = xOffset + colIndex * size + (rowIndex % 2 === 0 ? 0 : size / 2);
        let y = yOffset + rowIndex * h * 2; // Vertical position
    
        // Adjust for inverted triangles (staggered rows)
        if (orientation === "Inverted") {
            y += h;
        }
    
        // Define triangle vertices
        let vertices;
        if (orientation === "Normal") {
          // Normal (upward-facing) triangle
          vertices = [
              { x: x, y: y }, // Top
              { x: x - size / 2, y: y + h }, // Bottom-left
              { x: x + size / 2, y: y + h }, // Bottom-right
          ];
          // Define walls for Normal triangle
          walls = {
            upperright: [vertices[0], vertices[2]], // Top-right wall
            down: [vertices[2], vertices[1]],       // Bottom wall
            upperleft: [vertices[1], vertices[0]],  // Top-left wall
          };
        } else {
            // Inverted (downward-facing) triangle
            vertices = [
              { x: x, y: y + h }, // Bottom
              { x: x - size / 2, y: y }, // Top-left
              { x: x + size / 2, y: y }, // Top-right
            ];
            // Define walls for Inverted triangle
          walls = {
            upperright: [vertices[2], vertices[0]], // Bottom-right wall
            down: [vertices[0], vertices[1]],      // Top wall
            upperleft: [vertices[1], vertices[2]], // Bottom-left wall
          };
        }
    
        // Render walls based on "linked" array
        const svg = document.querySelector("svg");
        Object.keys(walls).forEach((key) => {
            if (!linked.includes(key)) {
                const [start, end] = walls[key];
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", start.x);
                line.setAttribute("y1", start.y);
                line.setAttribute("x2", end.x);
                line.setAttribute("y2", end.y);
                line.setAttribute("stroke", "black");
                line.setAttribute("stroke-width", "2");
                svg.appendChild(line);
            }
        });
    }

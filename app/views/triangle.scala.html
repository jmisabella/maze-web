      const size = 50; // Side length of the triangle
      const height = size * Math.sqrt(3) / 2;
  
      data.rows.forEach((row, rowIndex) => {
        row.forEach((cell) => {
          const { x, y } = cell.coords;
          const isNormal = cell.orientation === "Normal"; // Corrected orientation
          const cx = x * size / 2; // Calculate x position with overlap
          const cy = y * height; // Calculate y position to eliminate gaps
  
          // Define triangle points for Normal and Inverted orientations
          const points = isNormal
            ? `${cx},${cy + height} ${cx + size / 2},${cy} ${cx + size},${cy + height}`
            : `${cx},${cy} ${cx + size / 2},${cy + height} ${cx + size},${cy}`;
  
          // Determine which sides to render based on links
          let linkedSides = {
            top: false,
            left: false,
            right: false
          };
          
          cell.linked.forEach(link => {
            if (isNormal) {
              if (link === "upperright") linkedSides.right = true;
              if (link === "down") linkedSides.top = true;
              if (link === "upperleft") linkedSides.left = true;
            } else {
              if (link === "lowerleft") linkedSides.left = true;
              if (link === "up") linkedSides.top = true;
              if (link === "lowerright") linkedSides.right = true;
            }
          });
  
          // Create polygon with only required borders
          const polygon = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
          polygon.setAttribute("points", points);
          polygon.classList.add("triangle-cell");
  
          // Apply conditional classes for walls
          if (linkedSides.top) polygon.classList.add("top-wall");
          if (linkedSides.left) polygon.classList.add("left-wall");
          if (linkedSides.right) polygon.classList.add("right-wall");
  
          // Add special classes for start, goal, or solution path
          if (cell.isStart) polygon.classList.add("start");
          if (cell.isGoal) polygon.classList.add("goal");
          if (cell.onSolutionPath) polygon.classList.add("solution-path");
